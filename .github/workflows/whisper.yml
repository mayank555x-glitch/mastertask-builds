# Builds whisper.cpp for Windows ARM64 from source, and publishes it as a release asset.
#
# 🔴 IT EXISTS BECAUSE UPSTREAM PUBLISHES EVERY OTHER PLATFORM AND NOT THIS ONE. Checked 2026-08-30 against
# ggml-org/whisper.cpp v1.9.1: the release carries `whisper-bin-x64.zip`, `whisper-bin-Win32.zip`,
# `whisper-bin-ubuntu-arm64.tar.gz` and an xcframework — and no windows-arm64 anything. MasterTask already
# ships llama-cpu, onnx-cpu and ffmpeg for Windows ARM64, so transcription was the single dead capability on
# a platform where everything else worked.
#
# 🔴 CROSS-COMPILED WITH llvm-mingw, FOR THE SAME REASON AS ffmpeg. Ubuntu's mingw-w64 has x86_64 and i686
# targets only; `aarch64-w64-mingw32` exists only in llvm-mingw. The toolchain is pinned and its digest is
# logged, because it compiles a binary customers install.
#
# 🔴 THE ARTIFACT IS `whisper.dll`, NOT AN EXECUTABLE. MasterTask dlopens the library from its runner
# subprocess; a CLI binary would be useless to it. `-DBUILD_SHARED_LIBS=ON` is therefore not a preference.
name: whisper.cpp (Windows ARM64)

on:
  workflow_dispatch:
    inputs:
      whisper_version:
        description: "whisper.cpp release tag to build (e.g. v1.9.1)"
        required: true
        default: "v1.9.1"

permissions:
  contents: write

jobs:
  build:
    name: windows-arm64
    runs-on: ubuntu-latest
    steps:
      - name: llvm-mingw toolchain (pinned)
        run: |
          set -euo pipefail
          LLVM_MINGW=llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64
          curl -fsSL --retry 3 -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/${LLVM_MINGW}.tar.xz"
          shasum -a 256 llvm-mingw.tar.xz   # recorded in the log: the exact toolchain this build used
          sudo tar xJf llvm-mingw.tar.xz -C /opt
          echo "/opt/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"

      - name: fetch the pinned whisper.cpp source
        run: |
          set -euo pipefail
          V="${{ inputs.whisper_version }}"
          curl -fsSL "https://github.com/ggml-org/whisper.cpp/archive/refs/tags/${V}.tar.gz" -o src.tar.gz
          shasum -a 256 src.tar.gz   # recorded in the log: the exact bytes this build came from
          mkdir -p src && tar xzf src.tar.gz -C src --strip-components=1

      - name: configure and build
        run: |
          set -euo pipefail
          # 🔴 NO -DGGML_NATIVE. It compiles for the MACHINE DOING THE BUILD, which here is an x86_64 runner
          # — the resulting binary would carry instructions an ARM64 CPU cannot execute, and would fail at
          # load on the only machine it is for. Cross builds must always turn it off.
          #
          # 🔴 THE `lib` PREFIX IS DEALT WITH IN `collect`, NOT HERE, AND THE FIRST ATTEMPT PROVES WHY.
          # mingw prefixes shared libraries with `lib` and MSVC does not, so this build emits
          # `libwhisper.dll` while upstream's whisper-bin-x64.zip carries `whisper.dll` — and MasterTask's
          # recipe names `entrypoint: whisper.dll` for every platform. Passing
          # `-DCMAKE_SHARED_LIBRARY_PREFIX=""` looked like the clean fix and CHANGED NOTHING (measured: the
          # build still produced libwhisper.dll), because whisper.cpp sets the prefix per target — which is
          # visible in the output itself, where `ggml.dll` has no prefix and `libwhisper.dll` does.
          #
          # 🔴 THE C++ RUNTIME IS LINKED STATICALLY, AND THE IMPORT CHECK IN `collect` IS WHAT FOUND THAT IT
          # HAD TO BE. llvm-mingw links against ITS OWN `libc++.dll` and `libunwind.dll`, which live in the
          # toolchain on the build machine and on no customer's Windows anywhere. The artifact built,
          # zipped, hashed and would have verified perfectly — and failed at load with a missing library
          # nobody has heard of. Static linking removes the dependency instead of shipping two more DLLs
          # whose licences and updates we would then own.
          cmake -S src -B build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=ARM64 \
            -DCMAKE_C_COMPILER=aarch64-w64-mingw32-clang \
            -DCMAKE_CXX_COMPILER=aarch64-w64-mingw32-clang++ \
            -DCMAKE_RC_COMPILER=aarch64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc -static-libstdc++ -Wl,-Bstatic -lc++ -lunwind -Wl,-Bdynamic" \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build build --config Release -j"$(nproc)"

      - name: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          # 🔴 EVERY .dll THE BUILD PRODUCED, NOT JUST whisper.dll. ggml is split into its own libraries
          # (ggml.dll, ggml-base.dll, ggml-cpu.dll); shipping whisper.dll alone produces an artifact that
          # loads on the build machine — where the others sit beside it — and fails on a customer's with a
          # missing-dependency error naming a library they have never heard of.
          # 🔴 UNDER `Release/`, BECAUSE THAT IS THE SHAPE UPSTREAM SHIPS AND THE RECIPE STRIPS. The x64
          # zip is `Release/whisper.dll`, and MasterTask's recipe carries `strip: 1` for it. A flat zip here
          # would need a different strip for one platform — a per-platform special case in a data file, and
          # the kind that is only discovered when a customer's install produces an empty directory.
          mkdir -p dist/Release
          find build -name '*.dll' -exec cp {} dist/Release/ \;
          ls -la dist/Release
          # 🔴 RENAMED, THEN ITS IMPORTS ARE CHECKED — the rename is the easy half. Nothing imports
          # whisper by name (MasterTask dlopens it by path), so renaming it is safe; but a rename that
          # broke a dependency would produce a DLL that loads on nothing, and the error a customer sees is
          # a missing library they have never heard of. So every DLL this one imports is resolved against
          # what actually ships beside it.
          mv dist/Release/libwhisper.dll dist/Release/whisper.dll
          test -f dist/Release/whisper.dll || { echo "libwhisper.dll was not produced at all"; exit 1; }

          # 🔴 `llvm-readobj --coff-imports`, NOT `objdump -p`. objdump prints the module's OWN name in the
          # export table using the same "DLL name:" label it uses for imports, so a grep over it reported
          # `libwhisper.dll` as a missing dependency OF ITSELF — a false alarm that would have sent the next
          # reader looking for a broken rename. readobj emits imports and nothing else.
          echo "--- whisper.dll imports ---"
          llvm-readobj --coff-imports dist/Release/whisper.dll \
            | awk -F': *' '/^ *Name:/ {print $2}' | tr -d '\r' | sort -u > /tmp/imports.txt
          cat /tmp/imports.txt
          missing=0
          while read -r dep; do
            [ -z "$dep" ] && continue
            # A system DLL lives on the customer's Windows, not in our zip.
            case "$(echo "$dep" | tr 'A-Z' 'a-z')" in
              kernel32.dll|user32.dll|advapi32.dll|msvcrt.dll|ucrtbase.dll|api-ms-*|ws2_32.dll|ole32.dll|shell32.dll|bcrypt.dll|crypt32.dll|winmm.dll|powrprof.dll|dbghelp.dll|version.dll|iphlpapi.dll|secur32.dll|ntdll.dll) continue ;;
            esac
            if [ ! -f "dist/Release/$dep" ]; then
              echo "MISSING DEPENDENCY: whisper.dll imports $dep, which is not in the artifact"; missing=1
            fi
          done < /tmp/imports.txt
          [ "$missing" -eq 0 ] || { echo "the artifact would fail to load on a customer machine"; exit 1; }
          # 🔴 PROOF THE BYTES ARE REALLY ARM64. A cross build that silently fell back to the host compiler
          # produces a working x86_64 DLL that passes every other check here and fails on the only machine
          # it is for. `file` is the cheapest thing that can tell the difference.
          file dist/Release/whisper.dll
          file dist/Release/whisper.dll | grep -qiE "aarch64|arm64" || {
            echo "whisper.dll is NOT an ARM64 binary — the cross compiler was not used"; exit 1; }
          cp src/LICENSE dist/Release/LICENSE.txt
          cd dist && zip -r ../whisper-bin-arm64.zip . && cd ..

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "whisper-${{ inputs.whisper_version }}-winarm64" whisper-bin-arm64.zip \
            --title "whisper.cpp ${{ inputs.whisper_version }} for Windows ARM64" \
            --notes "Cross-compiled from ggml-org/whisper.cpp tag ${{ inputs.whisper_version }} with llvm-mingw (pinned 20260826), which carries the aarch64-w64-mingw32 target Ubuntu's mingw-w64 does not.
          Upstream publishes x64, Win32, ubuntu-arm64 and an xcframework — but no Windows ARM64 binary, which left transcription as the one dead capability on a platform where chat, vision and video all worked.
          Shared libraries (whisper.dll plus the ggml libraries it depends on); GitHub publishes a sha256 for the asset, so MasterTask verifies it on the same path as every other artifact." \
            --repo "${{ github.repository }}"
