# Builds llama.cpp and whisper.cpp for LINUX + NVIDIA from source, and publishes them as release assets.
#
# 🔴 IT EXISTS BECAUSE NEITHER UPSTREAM PUBLISHES A LINUX CUDA BUILD, AND LINUX+NVIDIA IS THE STANDARD
# ENTERPRISE GPU HOST. Checked 2026-08-30 against the exact pinned tags:
#   llama.cpp b9964  → win-cuda-12.4, ubuntu-rocm, ubuntu-sycl, ubuntu-vulkan, ubuntu-arm64 … no ubuntu-cuda
#   whisper.cpp v1.9.1 → whisper-cublas-12.4.0-bin-x64 (Windows only); ubuntu assets are CPU
# So on a Linux machine with an NVIDIA card, MasterTask ran chat and transcription on the CPU while
# onnx-cuda12-linux-x64 used the GPU beside it — a silent, per-engine performance cliff.
#
# 🔴 THE RUNNER HAS NO GPU, AND THAT LIMIT IS STATED RATHER THAN PAPERED OVER. This proves the artifacts
# BUILD and LINK against CUDA and that the CUDA symbols are really present; it cannot prove inference. The
# `ldd`/`nm` checks below are what stands in for that, and they are the difference between "it compiled"
# and "it is a CUDA build" — a CPU-only fallback compiles perfectly and would ship as `cuda12`.
name: llama.cpp + whisper.cpp (Linux CUDA)

on:
  workflow_dispatch:
    inputs:
      llama_version:
        description: "llama.cpp tag (e.g. b9964)"
        required: true
        default: "b9964"
      whisper_version:
        description: "whisper.cpp tag (e.g. v1.9.1)"
        required: true
        default: "v1.9.1"
      cuda_version:
        description: "CUDA toolkit version (12.x builds the cuda12 artifacts, 13.x the cuda13 ones — H32 decision 4)"
        required: true
        default: "12.4.0"
      revision:
        description: >-
          Suffix for the release tag when the SAME upstream versions must be rebuilt (e.g. r2). Publishing never
          replaces an asset, because a version identifies bytes — so a corrected build needs its own tag, and this
          is how it gets one. Left empty for a first build.
        required: false
        default: ""

permissions:
  contents: write

env:
  CUDA_MAJOR: ${{ startsWith(inputs.cuda_version, '13.') && '13' || '12' }}
  # 🔴 CUDA 13 USES GGML'S OWN ARCHITECTURE LIST, NOT "all-major". all-major names Blackwell as plain `120`, which
  # also compiles every kernel as PTX, and nvcc cannot assemble ggml's FP4 kernel as PTX ("mma with block scale not
  # supported on sm_120" — measured on 13.2.2 and 13.3.1). ggml's default, which upstream's CUDA 13 release uses, is
  # exactly this list: 120a-real/121a-real for Blackwell (architecture-specific, never PTX), 75+ for everything else.
  CUDA_ARCHS: ${{ startsWith(inputs.cuda_version, '13.') && '75-virtual;80-virtual;86-real;89-real;90-virtual;120a-real;121a-real' || 'all-major' }}

jobs:
  build:
    name: ${{ matrix.engine }}-cuda-linux-x64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false # one engine failing must not hide the state of the other
      matrix:
        include:
          - { engine: llama, repo: ggml-org/llama.cpp, entry: libllama.so, target: llama }
          - { engine: whisper, repo: ggml-org/whisper.cpp, entry: libwhisper.so, target: whisper }
    steps:
      # 🔴 ubuntu-22.04, NOT ubuntu-latest. CUDA 12.4's host compiler support tops out below the GCC that
      # ships on 24.04, and nvcc rejects it outright — "unsupported GNU version". Pinning the runner is
      # cheaper than pinning a compiler inside it.
      - name: CUDA toolkit ${{ inputs.cuda_version }}
        uses: Jimver/cuda-toolkit@v0.2.36 # v0.2.36 lists CUDA 13.0.0-13.3.1; CUDA 13 builds use 13.3.1, as llama.cpp upstream uses 13.3 (13.2.2 nvcc cannot assemble ggml's sm_120 MXFP4 kernel — measured)
        with:
          cuda: ${{ inputs.cuda_version }}
          method: network
          # Only what a build needs. The full toolkit is ~4 GB and most of it is profilers and samples.
          #
          # 🔴 cuBLAS IS NOT A `cuda-` PACKAGE, AND PUTTING IT HERE FAILS THE INSTALL. Everything in
          # `sub-packages` is prefixed `cuda-`, giving `cuda-cublas-12-4` — which does not exist on
          # NVIDIA's apt repo. Measured: `E: Unable to locate package cuda-cublas-12-4`. The real names are
          # `libcublas-12-4` / `libcublas-dev-12-4`, and `non-cuda-sub-packages` is the input for exactly
          # that difference.
          sub-packages: '["nvcc", "cudart", "nvtx"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: fetch the pinned source
        run: |
          set -euo pipefail
          V="${{ matrix.engine == 'llama' && inputs.llama_version || inputs.whisper_version }}"
          curl -fsSL "https://github.com/${{ matrix.repo }}/archive/refs/tags/${V}.tar.gz" -o src.tar.gz
          shasum -a 256 src.tar.gz   # recorded in the log: the exact bytes this build came from
          mkdir -p src && tar xzf src.tar.gz -C src --strip-components=1

      - name: configure and build
        run: |
          set -euo pipefail
          # 🔴 GGML_NATIVE=OFF. It compiles for the runner's own CPU, which is not the customer's — a
          # -march=native build crashes with SIGILL on any older machine, and only on some of them.
          # 🔴 CMAKE_CUDA_ARCHITECTURES pins the GPU generations this supports. "all-major" covers Maxwell
          # through Hopper in one binary; leaving it unset builds for the BUILDER's card, and the runner
          # has none, so the default is whatever nvcc guesses.
          cmake -S src -B build \
            -DGGML_CUDA=ON \
            -DGGML_NATIVE=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCHS}" \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF
          # 🔴 THE LIBRARY TARGET ONLY, NOT `all`. MasterTask dlopens libllama.so / libwhisper.so; it never
          # runs their CLI tools. Building everything cost 48 minutes of correct CUDA compilation and then
          # failed at the final link — `cannot find -lllama-server-impl` — because turning the server and
          # examples off left llama.cpp's `llama-app` target still trying to link them. Naming the target
          # removes a whole class of failure that has nothing to do with what we ship, and is faster.
          cmake --build build --config Release -j"$(nproc)" --target ${{ matrix.target }}

      - name: collect and PROVE it is a CUDA build
        run: |
          set -euo pipefail
          mkdir -p dist
          # 🔴🔴 `*.so*`, AND `cp -P`. THE FIRST VERSION SHIPPED TWO BUILDS THAT COULD NOT LOAD ANYWHERE.
          # It was `find build -name '*.so' -exec cp {} dist/ \;`, which is wrong twice over: `-name '*.so'`
          # matches the bare development name only, never `libggml.so.0` or `libggml.so.0.15.1`, and plain `cp`
          # FOLLOWS a symlink, so `libggml.so` — a link to the versioned file — was copied as a real file under
          # the link's name while the two names the loader actually asks for were left behind.
          #
          # The loader asks for the SONAME. `libwhisper.so` records `libggml.so.0` as a needed library, so every
          # machine answered `libggml.so.0: cannot open shared object file: No such file or directory`. Measured
          # on the published artifacts of 2026-09-18: llama-cuda13-linux-x64 and whisper-cuda13-linux-x64 both
          # carried a single 55 KB `libggml.so` and no `.so.0` at all, while the upstream CPU and Vulkan builds
          # beside them carried the full chain `libggml.so` → `.so.0` → `.so.0.15.1`.
          #
          # `whisper-gpu.yml` has had this right since it was written (`-name '*.so*' -exec cp -P`); this file is
          # the one that did not, and nothing compared them.
          find build -name '*.so*' -exec cp -P {} dist/ \;
          ls -la dist
          test -f "dist/${{ matrix.entry }}" || { echo "${{ matrix.entry }} was not produced"; exit 1; }

          # 🔴 A CPU-ONLY FALLBACK COMPILES PERFECTLY AND WOULD SHIP AS `cuda12`. If GGML_CUDA silently did
          # not take, everything above still succeeds and the artifact installs on a GPU machine and quietly
          # runs on the CPU — the exact failure this whole workflow exists to remove. So the CUDA runtime
          # must be a real, named dependency of the bytes.
          echo "--- linked libraries ---"
          ldd dist/*.so | sort -u | grep -iE "cuda|cublas" || {
            echo "NO CUDA LIBRARY IS LINKED — this is a CPU build wearing a cuda12 label"; exit 1; }

          echo "--- CUDA symbols present? ---"
          nm -D --defined-only dist/*.so 2>/dev/null | grep -qi "ggml_backend_cuda" || {
            echo "the CUDA backend symbols are absent — GGML_CUDA did not take"; exit 1; }

          # 🔴🔴 AND EVERY LIBRARY IT ASKS FOR IS ACTUALLY THERE. The `ldd` above already PRINTED
          # "libggml.so.0 => not found" and nothing read it: it greps for `cuda|cublas` and is satisfied by a
          # match anywhere, so a build that could not load a single symbol passed the step named "PROVE it is a
          # CUDA build". A guard that runs on the right file and asks the wrong question is worse than none —
          # it is the reason two dead artifacts were signed, published, and verified byte-for-byte.
          #
          # `libcuda.so.1` is the DRIVER and is deliberately allowed to be missing: no build machine has a GPU,
          # and every customer machine with an NVIDIA card has it. Anything else unresolved is a broken package.
          echo "--- does every needed library resolve? ---"
          MISSING=$(cd dist && ldd ./*.so 2>/dev/null | grep 'not found' | grep -v 'libcuda\.so\.1' | sort -u || true)
          if [ -n "$MISSING" ]; then
            echo "🔴 these artifacts cannot be loaded — a needed library is not in the package:"
            echo "$MISSING"
            exit 1
          fi

          # And the entrypoint OPENS. `ldd` reads a table; `dlopen` is what the product does, and it is the only
          # thing that proves the package is whole. The one thing a build machine legitimately cannot satisfy is
          # the NVIDIA driver, so a failure that names `libcuda.so.1` is reported and accepted — and ANY OTHER
          # failure is a broken package, which is exactly the case that shipped.
          echo "--- does the entrypoint actually dlopen? ---"
          printf '%s\n' \
            '#include <dlfcn.h>' \
            '#include <stdio.h>' \
            'int main(int argc, char **argv) {' \
            '  void *h = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);' \
            '  if (!h) { fprintf(stderr, "%s\n", dlerror()); return 1; }' \
            '  printf("dlopen ok\n"); return 0; }' > /tmp/opencheck.c
          cc -o /tmp/opencheck /tmp/opencheck.c -ldl
          OPENERR=$( cd dist && LD_LIBRARY_PATH="$PWD" /tmp/opencheck "./${{ matrix.entry }}" 2>&1 >/dev/null ) || {
            case "$OPENERR" in
              *libcuda.so.1*)
                echo "   ${{ matrix.entry }} opened as far as this machine can take it; only the NVIDIA driver"
                echo "   (libcuda.so.1) is missing, which no build runner has: $OPENERR" ;;
              *)
                echo "🔴 ${{ matrix.entry }} does not load: $OPENERR"
                echo "   It would fail on every customer machine exactly as it fails here, and nothing"
                echo "   downstream — signing, publishing, verifybytes — can see it: they all check bytes."
                exit 1 ;;
            esac
          }

          # The CUDA runtime libraries themselves, so the artifact is self-contained exactly like the
          # Windows one (which merges cudart alongside the engine).
          for lib in libcudart libcublas libcublasLt; do
            find "${CUDA_PATH:-/usr/local/cuda}" -name "${lib}.so.*" -exec cp -n {} dist/ \; 2>/dev/null || true
          done
          ls -la dist
          cp src/LICENSE dist/LICENSE.txt 2>/dev/null || cp src/LICENSE.txt dist/ 2>/dev/null || true
          # 🔴 THE LABEL IS THE TOOLKIT'S MAJOR VERSION, never typed: a CUDA 13 build published as `cuda12` would be ranked
          # for Pascal cards whose kernels CUDA 13 dropped (llama.cpp b9964 ggml/src/ggml-cuda/CMakeLists.txt).
          LABEL="cuda${CUDA_MAJOR}"
          tar czf ${{ matrix.engine }}-${LABEL}-linux-x64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.engine }}-cuda-linux
          path: ${{ matrix.engine }}-cuda*-linux-x64.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          # CUDA 12 keeps its original tag so VAULT's existing source still resolves; CUDA 13 gets its own.
          TAG="cuda-linux-llama-${{ inputs.llama_version }}-whisper-${{ inputs.whisper_version }}"
          if [ "${CUDA_MAJOR}" != "12" ]; then TAG="cuda${CUDA_MAJOR}-linux-llama-${{ inputs.llama_version }}-whisper-${{ inputs.whisper_version }}"; fi
          # A rebuild of the same upstream versions takes its own tag: the assets below are never replaced, so
          # corrected bytes under the old tag would be silently ignored and the broken ones kept.
          if [ -n "${{ inputs.revision }}" ]; then TAG="${TAG}-${{ inputs.revision }}"; fi
          # 🔴 ONE ASSET AT A TIME, WITH RETRIES, AND NEVER A REPLACEMENT. A ~1 GB upload answered HTTP 500 ("Error saving
          # asset") and took the whole publish with it, leaving an empty draft; and a version identifies bytes, so an asset
          # already published is kept as it is. The release is published only once every asset is on it.
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "$TAG" --draft \
            --title "llama.cpp ${{ inputs.llama_version }} + whisper.cpp ${{ inputs.whisper_version }} — Linux CUDA ${{ inputs.cuda_version }}" \
            --notes "Neither upstream publishes a Linux CUDA build. llama.cpp ships win-cuda, ubuntu-rocm, ubuntu-sycl, ubuntu-vulkan and ubuntu-arm64; whisper.cpp's ubuntu assets are CPU only. On a Linux host with an NVIDIA card that left chat and transcription on the CPU while ONNX used the GPU beside them.
          Built from each upstream's pinned tag with -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCHS}, and verified to LINK against CUDA and to export the ggml_backend_cuda symbols — a CPU-only fallback compiles perfectly and would otherwise ship wearing a cuda12 label. The CUDA runtime libraries are bundled so the artifact is self-contained, as the Windows build is.
          The runner has no GPU, so this proves the build and the linkage, not inference." \
            --repo "${{ github.repository }}"
          have=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          for f in dist/*; do
            name=$(basename "$f")
            if printf '%s\n' "$have" | grep -qx "$name"; then echo "$name is already published under $TAG — kept as it is"; continue; fi
            for try in 1 2 3 4 5; do
              gh release upload "$TAG" "$f" --repo "${{ github.repository }}" && break
              echo "upload of $name failed (attempt $try) — GitHub answers 500 on a large asset now and then"
              [ "$try" = 5 ] && exit 1
              sleep $((try * 30))
            done
          done
          gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
