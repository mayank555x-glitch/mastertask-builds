# Builds whisper.cpp for the GPUs no upstream build covers, and publishes them as release assets (MasterTask H32
# decisions 2 and 4):
#   whisper Vulkan  — Linux x64 and Windows x64: AMD, Intel and NVIDIA cards through one build. whisper.cpp v1.9.1
#                     publishes no Vulkan binary at all, so transcription on an AMD or Intel GPU ran on the processor.
#   whisper CUDA 13 — Windows x64: NVIDIA's Blackwell cards need CUDA ≥ 12.8; upstream ships only CUDA 12.4.
#
# 🔴 EACH BUILD IS PROVEN TO BE WHAT ITS NAME SAYS, NOT MERELY TO COMPILE. A GGML_VULKAN or GGML_CUDA that silently did not
# take still produces a working CPU library, which would ship wearing a GPU label and run on the processor. The
# Vulkan library must import the Vulkan loader and export its backend; the CUDA one must import cuBLAS.
#
# 🔴 THE RUNNERS HAVE NO GPU. This proves the build and its linkage. Loading and answering on a software Vulkan device is
# proven in MasterTask's own CI (H32 decision 20); a real card is H34.
name: whisper.cpp GPU builds (Vulkan Linux/Windows, CUDA 13 Windows)

on:
  workflow_dispatch:
    inputs:
      whisper_version:
        description: "whisper.cpp tag (e.g. v1.9.1)"
        required: true
        default: "v1.9.1"
      cuda_version:
        description: "CUDA toolkit for the Windows CUDA 13 build"
        required: true
        default: "13.3.1"

permissions:
  contents: write

env:
  # The SDK llama.cpp b9964's own release workflow builds its Windows Vulkan binary with.
  VULKAN_VERSION: 1.4.313.2

jobs:
  vulkan-linux:
    name: whisper-vulkan-linux-x64
    runs-on: ubuntu-24.04
    steps:
      - name: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y build-essential glslc libvulkan-dev spirv-headers
      - name: fetch the pinned source
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/ggml-org/whisper.cpp/archive/refs/tags/${{ inputs.whisper_version }}.tar.gz" -o src.tar.gz
          shasum -a 256 src.tar.gz
          mkdir -p src && tar xzf src.tar.gz -C src --strip-components=1
      - name: configure and build
        run: |
          set -euo pipefail
          # 🔴 GGML_NATIVE=OFF: the runner's CPU is not the customer's, and a -march=native build dies with SIGILL.
          # 🔴 RPATH=$ORIGIN: libwhisper.so finds libggml*.so beside it wherever MasterTask unpacks it.
          cmake -S src -B build -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build build --config Release -j"$(nproc)" --target whisper
      - name: collect and PROVE it is a Vulkan build
        run: |
          set -euo pipefail
          mkdir -p dist
          find build -name '*.so*' -exec cp -P {} dist/ \;
          ls -la dist
          test -f dist/libwhisper.so || { echo "libwhisper.so was not produced"; exit 1; }
          ldd dist/*.so | grep -q "libvulkan" || { echo "NO VULKAN LOADER IS LINKED — a CPU build wearing a vulkan label"; exit 1; }
          nm -D --defined-only dist/*.so | grep -qi "ggml_backend_vk" || { echo "the Vulkan backend symbols are absent"; exit 1; }
          cp src/LICENSE dist/LICENSE.txt
          tar czf whisper-vulkan-linux-x64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with: { name: whisper-vulkan-linux-x64, path: whisper-vulkan-linux-x64.tar.gz }

  vulkan-windows:
    name: whisper-vulkan-windows-x64
    runs-on: windows-2022
    steps:
      - name: Vulkan SDK ${{ env.VULKAN_VERSION }}
        shell: pwsh
        run: |
          curl.exe -fL -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"
      - name: fetch the pinned source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/ggml-org/whisper.cpp/archive/refs/tags/${{ inputs.whisper_version }}.tar.gz" -o src.tar.gz
          sha256sum src.tar.gz
          mkdir -p src && tar xzf src.tar.gz -C src --strip-components=1
      - name: configure and build
        shell: pwsh
        run: |
          cmake -S src -B build -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS --target whisper
      - name: collect and PROVE it is a Vulkan build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/Release | Out-Null
          Get-ChildItem build -Recurse -Filter *.dll | Copy-Item -Destination dist/Release
          Get-ChildItem dist/Release
          if (-not (Test-Path dist/Release/whisper.dll)) { throw "whisper.dll was not produced" }
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          $imports = Get-ChildItem dist/Release -Filter *.dll | ForEach-Object { & $dumpbin.FullName /dependents $_.FullName } | Out-String
          if ($imports -notmatch 'vulkan-1\.dll') { throw "NO DLL IMPORTS vulkan-1.dll — a CPU build wearing a vulkan label" }
          Copy-Item src/LICENSE dist/Release/LICENSE.txt
          Compress-Archive -Path dist/Release -DestinationPath whisper-vulkan-bin-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: whisper-vulkan-windows-x64, path: whisper-vulkan-bin-x64.zip }

  cuda13-windows:
    name: whisper-cuda13-windows-x64
    runs-on: windows-2022
    steps:
      - name: CUDA toolkit ${{ inputs.cuda_version }}
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ inputs.cuda_version }}
          method: network
          # 🔴 `crt`: CUDA 13 moved its C runtime headers (crt/host_config.h) into their own component — without it nvcc
          # cannot compile CMake's first test file (measured: "Cannot open include file: 'crt/host_config.h'").
          # 🔴 `nvvm`: CUDA 13 ships nvcc's device compiler (cicc) in its own component too — without it the compiler-ID step
          # fails inside "%CICC_PATH%\cicc" (measured on this workflow's second run).
          sub-packages: '["nvcc", "nvvm", "cudart", "crt", "cublas", "cublas_dev", "visual_studio_integration", "nvtx"]'
      - name: fetch the pinned source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/ggml-org/whisper.cpp/archive/refs/tags/${{ inputs.whisper_version }}.tar.gz" -o src.tar.gz
          sha256sum src.tar.gz
          mkdir -p src && tar xzf src.tar.gz -C src --strip-components=1
      - name: configure and build
        shell: pwsh
        run: |
          # 🔴 GGML'S OWN CUDA 13 ARCHITECTURE LIST, NOT "all-major": all-major names Blackwell as plain 120, which also
          # compiles every kernel as PTX, and nvcc cannot assemble the FP4 kernel as PTX (measured, cuda-linux.yml).
          cmake -S src -B build -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=ON "-DCMAKE_CUDA_ARCHITECTURES=75-virtual;80-virtual;86-real;89-real;90-virtual;120a-real;121a-real" `
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS --target whisper
      - name: collect and PROVE it is a CUDA build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/Release | Out-Null
          Get-ChildItem build -Recurse -Filter *.dll | Copy-Item -Destination dist/Release
          if (-not (Test-Path dist/Release/whisper.dll)) { throw "whisper.dll was not produced" }
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          $imports = Get-ChildItem dist/Release -Filter *.dll | ForEach-Object { & $dumpbin.FullName /dependents $_.FullName } | Out-String
          if ($imports -notmatch 'cublas64_13\.dll') { throw "NO DLL IMPORTS cublas64_13.dll — not a CUDA 13 build" }
          # The CUDA runtime ships inside, as upstream's Windows CUDA build merges cudart; the driver never does.
          foreach ($lib in 'cudart64_13.dll','cublas64_13.dll','cublasLt64_13.dll') {
            $f = Get-ChildItem $env:CUDA_PATH -Recurse -Filter $lib | Select-Object -First 1
            if (-not $f) { throw "the CUDA runtime $lib was not found to bundle" }
            Copy-Item $f.FullName dist/Release/
          }
          Copy-Item src/LICENSE dist/Release/LICENSE.txt
          Get-ChildItem dist/Release
          Compress-Archive -Path dist/Release -DestinationPath whisper-cuda13-bin-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: whisper-cuda13-windows-x64, path: whisper-cuda13-bin-x64.zip }

  publish:
    needs: [vulkan-linux, vulkan-windows, cuda13-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "whisper-${{ inputs.whisper_version }}-gpu" dist/* \
            --title "whisper.cpp ${{ inputs.whisper_version }} — Vulkan (Linux, Windows) and CUDA ${{ inputs.cuda_version }} (Windows)" \
            --notes "Built from whisper.cpp's pinned tag. Vulkan: -DGGML_VULKAN=ON, verified to link the Vulkan loader. CUDA 13: -DGGML_CUDA=ON with the CUDA runtime bundled, verified to import cuBLAS 13. GGML_NATIVE=OFF throughout. The runners have no GPU, so this proves the build and its linkage, not inference." \
            --repo "${{ github.repository }}"
